# 在 macOS 上交叉打 Windows 内测包用（pnpm dist:win:cross）。正式发版请在 Windows 机器 / CI 上用 dist:win。
# node-gyp 不支持交叉编译，这里关掉 rebuild，直接用各原生模块自带的 win32-x64 预编译文件（都是 N-API，与 Electron 版本无关）：
#   node-pty/prebuilds/win32-x64、better-sqlite3-multiple-ciphers/prebuilds/win32-x64.node、
#   @serialport/bindings-cpp/prebuilds/win32-x64
# 本机 install 时编出来的 build/ 目录是 macOS 二进制，必须排除：node-gyp-build（serialport）会优先加载 build/Release。
# MSI 依赖 WiX，只能在 Windows 上打；目标在 package.json 命令行里限定为 nsis（extends 会合并 win.target，不能在这里覆盖）。不签名。
extends: ./electron-builder.yml
npmRebuild: false
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/node-pty/build/**"
  - "!**/node_modules/@serialport/bindings-cpp/build/**"
  - "!**/node_modules/better-sqlite3-multiple-ciphers/build/**"
  - "!**/node_modules/cpu-features/build/**"
  - "!**/node_modules/ssh2/lib/protocol/crypto/build/**"
  - "!**/node_modules/*/prebuilds/{darwin,linux}*/**"
  - "!**/node_modules/*/prebuilds/{darwin,linux}*.node"
